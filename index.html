<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的履歷</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9fb;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #4a90e2, #357ab7);
      color: white;
      padding: 2rem 1rem;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header h2 {
      margin: 0.5rem 0 1rem;
      font-size: 1.2rem;
      font-weight: normal;
    }

    header img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      border: 3px solid white;
      margin-top: 0.5rem;
      object-fit: cover;
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    section {
      background: white;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    section h2 {
      border-left: 5px solid #4a90e2;
      padding-left: 10px;
      margin-bottom: 1rem;
      font-size: 1.4rem;
      color: #357ab7;
    }

    ul {
      list-style: disc;
      padding-left: 1.5rem;
    }

    ul li {
      margin: 0.5rem 0;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #357ab7;
      color: white;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>徐芷吟</h1>
    <h2>Catherine</h2>
   <!-- 照片放這裡 -->
    <img src="https://drive.google.com/file/d/1ND8bSQBpy0cZ9TGjMCXE1ZIPXV9eXGjR/view?usp=drive_link" alt="我的照片">
  </header>

  <div class="container">
    <section>
      <h2>就學經歷</h2>
      <ul>
        <li>國小(台灣) </li>
        <li>國高中(昆山)</li>
      </ul>
    </section>

    <section>
      <h2>喜歡去的地方</h2>
      <ul>
        <li>海邊</li>
        <li>KTV</li>
        <li>貓咖狗咖</li>
      </ul>
    </section>

    <section>
      <h2>喜歡吃的東西</h2>
      <ul>
        <li>火鍋</li>
        <li>烤冷面</li>
        <li>各種有料的手搖飲</li>
      </ul>
    </section>

    <section>
      <h2>喜歡的歌手和歌</h2>
      <ul>
        <li>8lak-paradise</li>
        <li>Tyson-Christy</li>
        <li>盧廣仲-幾分之幾</li>
      </ul>

    <section>
      <h2>個性</h2>
      <ul>
        <li>超級感性 很容易共情</li>
        <li>不敢主動找陌生人聊天 但其實很想交各種朋友</li>
        <li>有點優柔寡斷和選擇困難</li>
      </ul>
    </section>

    <section>
      <h2>喜歡的 YouTube</h2>
      <ul>
        <li>HOOK</li>
        <li>酷的夢</li>
        <li>千千</li>
      </ul>
    </section>
  </div>

  <footer>
    <p>© 2025 徐芷吟 個人履歷</p>
  </footer>
</body>
</html>
